[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 20 per the spec. Vite 8 needs >= 20.19, which "20" resolves to on
  # Netlify; package.json declares the same range so a wrong runtime fails
  # with a clear message instead of a confusing build error.
  NODE_VERSION = "20"

# Single page app: everything falls back to the entry document.
#
# There is deliberately NO rule for /api here. The functions declare their own
# paths in code (export const config = { path: '/api/...' }), and a function
# with a declared path is matched before static resolution - that is what the
# `preferStatic` option exists to turn off. A hand-written /api rule would
# either be a no-op or a rewrite to itself, and neither is worth the risk of
# shadowing the routing that is already correct.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
